<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام رايت للاستشارات الطلابية</title>
    <!-- تصميم محدث جديد -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #10b981 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: backgroundShift 10s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% {
                background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #10b981 100%);
            }
            50% {
                background: linear-gradient(135deg, #059669 0%, #0891b2 50%, #0284c7 100%);
            }
        }

        /* خلفية متحركة */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.05)"/><circle cx="10" cy="60" r="0.5" fill="rgba(255,255,255,0.05)"/><circle cx="90" cy="40" r="0.5" fill="rgba(255,255,255,0.05)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981 0%, #059669 50%, #0284c7 100%);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* تصميم اللوجو الجديد */
        .brand-section {
            margin-bottom: 40px;
        }

        .right-logo-modern {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            position: relative;
            background: linear-gradient(135deg, #10b981 0%, #059669 30%, #0284c7 100%);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 15px 35px rgba(78, 205, 196, 0.3),
                0 5px 15px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            overflow: hidden;
        }

        .right-logo-modern::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .right-logo-modern:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow:
                0 25px 50px rgba(78, 205, 196, 0.4),
                0 10px 25px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .right-logo-modern:hover::before {
            opacity: 1;
            transform: translateX(100%) translateY(100%) rotate(45deg);
        }

        .logo-text-ar {
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 32px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            line-height: 1;
            margin-bottom: -5px;
        }

        .logo-text-en {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 5px rgba(0,0,0,0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: #718096;
            margin-bottom: 0;
            letter-spacing: 0.5px;
        }

        /* تصميم النموذج */
        .login-form {
            text-align: right;
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }

        .form-group:first-child {
            margin-top: 10px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
        }

        .form-control {
            width: 100%;
            padding: 20px 24px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            text-align: center;
            font-weight: 500;
        }

        .form-control::placeholder {
            color: #a0aec0;
            font-weight: 400;
            text-align: center;
        }

        .form-control:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
            background: white;
            transform: translateY(-2px) scale(1.02);
        }

        .btn-login {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.3);
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.5);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* تصميم التنبيهات */
        .alert {
            border-radius: 16px;
            margin-bottom: 25px;
            padding: 16px 20px;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-weight: 500;
        }

        .alert-danger {
            background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
            color: #c53030;
            border-left: 4px solid #e53e3e;
        }

        .alert-success {
            background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
            color: #2f855a;
            border-left: 4px solid #38a169;
        }

        /* تجاوب مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            .login-wrapper {
                padding: 15px;
            }
            
            .login-container {
                padding: 40px 30px;
            }
            
            .right-logo-modern {
                width: 100px;
                height: 100px;
            }
            
            .logo-text-ar {
                font-size: 26px;
            }
            
            .brand-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 25px;
            }
            
            .right-logo-modern {
                width: 90px;
                height: 90px;
            }
            
            .logo-text-ar {
                font-size: 22px;
            }
            
            .brand-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="brand-section">
                <div class="right-logo-modern">
                    <span class="logo-text-ar">رايت</span>
                    <span class="logo-text-en">RIGHT</span>
                </div>
                <h1 class="brand-title">نظام رايت للاستشارات الطلابية</h1>
                <p class="brand-subtitle">Right Student Consultancy System - تصميم محدث</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <div class="form-group">
                    <input type="text" class="form-control" id="username" name="username" placeholder="اسم المستخدم" required>
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="password" name="password" placeholder="كلمة المرور" required>
                </div>

                <button type="submit" class="btn-login">تسجيل الدخول</button>
            </form>


        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
